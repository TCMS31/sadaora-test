# Runs unprivileged, so the pid and temp paths must live somewhere writable.
pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames are immutable; index.html must never be cached or
    # a deploy leaves clients pointing at assets that no longer exist.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location = /index.html {
      add_header Cache-Control "no-store";
    }

    # Single-page app: unknown paths are client-side routes.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
